name: build images

# Public repo => unlimited free GitHub-hosted minutes and free GHCR storage.
# Nothing here needs a self-hosted runner, which keeps cluster capacity for
# things that actually have to run on the cluster.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs-screenshot*.png']
  pull_request:
    paths-ignore: ['**.md', 'docs-screenshot*.png']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { target: image-webtop-niri,     name: nixos-webtop-niri }
          - { target: image-webtop-hyprland, name: nixos-webtop-hyprland }
          - { target: image-webtop-i3,       name: nixos-webtop-i3 }
          - { target: image-base,            name: nixos-webtop-base }
    steps:
      # A GitHub runner has ~14GB free, and one of these images needs a ~8GB
      # Nix store plus a ~5GB tarball. Reclaiming the preinstalled Android SDK,
      # .NET and friends buys back ~25GB and is the difference between this
      # working and ENOSPC.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build ${{ matrix.image.target }}
        id: build
        run: |
          out="$(nix build ".#packages.x86_64-linux.${{ matrix.image.target }}" \
                  --no-link --print-out-paths -L)"
          echo "tarball=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      # skopeo streams the docker-archive straight to the registry. Going via
      # `docker load` would need the image unpacked on disk a second time, which
      # is exactly the space we do not have.
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
        run: |
          TAG="main-$(git rev-parse --short=7 HEAD)-$(date -u +%Y%m%d%H%M%S)"
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:${{ steps.build.outputs.tarball }}" \
            "docker://${REG}:${TAG}"
          # Registry-to-registry, so this needs BOTH sets of credentials. With
          # only --dest-creds skopeo cannot read back the tag it just wrote:
          #   initializing source docker://...: unable to retrieve auth token:
          #   invalid username/password: unauthorized
          # The blobs are already uploaded, so this copy is just a manifest write.
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://${REG}:${TAG}" "docker://${REG}:latest"
          echo "pushed ${REG}:${TAG}"
          echo "### \`${REG}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
