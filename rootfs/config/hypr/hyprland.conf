# Hyprland for the Nix Selkies webtop — Catppuccin Mocha.
#
# TUNED FOR SOFTWARE RENDERING. Hyprland runs here as a nested Wayland client
# of pixelflux's compositor, and unless a render node is passed in there is no
# GPU: everything is llvmpipe on the CPU, then x264-encoded for the browser.
# Blur is the single most expensive effect in that path, so it is OFF. Rounded
# corners, borders and shadows are close to free and carry the whole look.

$mod = SUPER
$term = ghostty
$menu = fuzzel
$browser = chromium

# ── Catppuccin Mocha ────────────────────────────────────────────────────────
$base     = 0xff1e1e2e
$mauve    = 0xffcba6f7
$pink     = 0xfff5c2e7
$surface0 = 0xff313244
$crust    = 0xff11111b

monitor = , preferred, auto, 1

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XDG_CURRENT_DESKTOP,Hyprland

exec-once = swaybg -m fill -i ~/.config/hypr/wallpaper.png
exec-once = waybar
exec-once = mako
exec-once = xwayland-satellite

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $mauve $pink 45deg
    col.inactive_border = $surface0
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        # Deliberately disabled — see the note at the top. Turn this on only if
        # you have passed a real render node into the container.
        enabled = false
    }

    shadow {
        enabled = true
        range = 18
        render_power = 2
        color = $crust
    }
}

animations {
    enabled = true
    # Short and snappy. Long animations look worse over a video stream because
    # every intermediate frame costs encode bandwidth.
    bezier = snap, 0.25, 1, 0.35, 1
    animation = windows, 1, 3, snap, popin 92%
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 4, snap, slide
    animation = border, 1, 6, snap
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad { natural_scroll = true }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# ── Keybinds ────────────────────────────────────────────────────────────────
bind = $mod, T, exec, $term
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, E, exec, nautilus
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrulev2 = float, class:^(fuzzel)$
windowrulev2 = opacity 0.96 0.90, class:^(foot)$
